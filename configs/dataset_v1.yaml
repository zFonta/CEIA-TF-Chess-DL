# Configuracion del dataset v1 - CEIA-TF-Chess-DL
#
# Este archivo es la fuente unica de verdad de los parametros del pipeline de datos.
# Se versiona junto con el codigo y se copia al dataset card (requerimiento 2.3).

version: v1

source:
  # Dumps mensuales de partidas estandar de Lichess (CC0, requerimiento 5.1).
  # Se pueden listar varios meses; el pipeline los procesa en orden y guarda
  # el progreso por (dump, offset) para poder reanudar.
  base_url: https://database.lichess.org/standard
  dumps:
    - "2025-06"

filter:
  # Requerimiento 1.1: umbral de ELO configurable, exigido a AMBOS jugadores.
  min_elo: 2200
  # Categorias de Lichess admitidas. Se excluyen Bullet y UltraBullet (mucho ruido
  # de reloj) y Correspondence (permite libros y tablas de finales).
  time_controls: [Blitz, Rapid, Classical]
  rated_only: true
  # Descarta partidas abandonadas o demasiado cortas para muestrear.
  min_plies: 20
  excluded_terminations: [Abandoned, "Rules infraction", Unterminated]

sampling:
  # Requerimiento 1.3: 4 posiciones por partida, 2 con blancas al turno y 2 con
  # negras, para garantizar el balance de color por construccion.
  positions_per_game: 4
  balance_by_turn: true
  # No se saltean aperturas: el muestreo cubre toda la partida.
  seed: 20260909

labeling:
  # Requerimiento 2.3: la profundidad queda registrada en cada fila del dataset,
  # junto con la version exacta de Stockfish detectada en tiempo de ejecucion.
  engine_path: stockfish
  depth: 12
  threads_per_engine: 1
  hash_mb: 64
  # null -> os.cpu_count(). El runtime de Colab varia, no conviene fijarlo.
  workers: null

normalization:
  # Requerimiento 1.1 (directa) y 4.2 (inversa):
  #   value = tanh(cp / scale)      cp = scale * atanh(value)
  # El recorte mantiene |value| < 1, asi la inversa nunca diverge.
  scale: 400.0
  cp_clip: 2000

output:
  games_per_shard: 5000
  local_dir: /content/ceia-chess/shards
  # El extracto filtrado y el estado de reanudacion son caros de regenerar (el
  # extracto cuesta una pasada completa sobre el dump), asi que en Colab van a
  # Drive: todo lo que esta bajo /content se pierde al reciclarse el runtime.
  extract_dir: /content/drive/MyDrive/ceia-chess/extracts
  state_path: /content/drive/MyDrive/ceia-chess/state.json
  push_to_hub: true
  hf_dataset: ceia-chess-eval

validation:
  # Requerimiento 1.3: ninguna clase de turno puede superar este porcentaje.
  max_turn_share: 0.55
