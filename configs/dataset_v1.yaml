# Configuracion del dataset v1 - CEIA-TF-Chess-DL
#
# Este archivo es la fuente unica de verdad de los parametros del pipeline de datos.
# Se versiona junto con el codigo y se copia al dataset card (requerimiento 2.3).

version: v1

source:
  # Dumps mensuales de partidas estandar de Lichess (CC0, requerimiento 5.1).
  # Se pueden listar varios meses; el pipeline los procesa en orden y guarda
  # el progreso por (dump, offset) para poder reanudar.
  base_url: https://database.lichess.org/standard
  dumps:
    - "2025-06"

filter:
  # Requerimiento 1.1: umbral de ELO configurable, exigido a AMBOS jugadores.
  min_elo: 2200
  # Categorias de Lichess admitidas. Se excluyen Bullet y UltraBullet (mucho ruido
  # de reloj) y Correspondence (permite libros y tablas de finales).
  time_controls: [Blitz, Rapid, Classical]
  rated_only: true
  # Descarta partidas abandonadas o demasiado cortas para muestrear.
  min_plies: 20
  excluded_terminations: [Abandoned, "Rules infraction", Unterminated]

sampling:
  # Requerimiento 1.3: 4 posiciones por partida, 2 con blancas al turno y 2 con
  # negras, para garantizar el balance de color por construccion.
  positions_per_game: 4
  balance_by_turn: true
  # No se saltean aperturas: el muestreo cubre toda la partida.
  seed: 20260909

labeling:
  # Requerimiento 2.3: la profundidad queda registrada en cada fila del dataset,
  # junto con la version exacta de Stockfish detectada en tiempo de ejecucion.
  engine_path: stockfish
  depth: 12
  threads_per_engine: 1
  hash_mb: 64
  # null -> os.cpu_count(). El runtime de Colab varia, no conviene fijarlo.
  workers: null

normalization:
  # Requerimiento 1.1 (directa) y 4.2 (inversa):
  #   value = tanh(cp / scale)      cp = scale * atanh(value)
  # El recorte mantiene |value| < 1, asi la inversa nunca diverge.
  scale: 400.0
  cp_clip: 2000

output:
  games_per_shard: 5000

  # Cache de trabajo. Es descartable: todo se puede reconstruir desde el Hub.
  local_dir: /content/ceia-chess/shards
  extract_dir: /content/ceia-chess/extracts
  state_path: /content/ceia-chess/state.json

  # Almacenamiento durable. Dos repositorios con roles distintos:
  #   hf_dataset      -> los shards etiquetados; es el entregable
  #   hf_work_dataset -> el extracto filtrado y el estado de reanudacion
  push_to_hub: true
  hf_dataset: ceia-chess-eval
  hf_work_dataset: ceia-chess-work

validation:
  # Requerimiento 1.3: ninguna clase de turno puede superar este porcentaje.
  max_turn_share: 0.55

training:
  # Particion POR PARTIDA, nunca por posicion. Hay 4 posiciones por partida y
  # comparten apertura, jugadores y estructura: partir por posicion deja
  # hermanas de la misma partida en entrenamiento y en test, lo que infla la
  # validacion y solo se descubre cuando el motor rinde peor que las metricas.
  #
  # La semilla es parte de la identidad del modelo: define que partidas nunca
  # vio. Cambiarla invalida cualquier metrica de test ya reportada.
  split_train: 0.90
  split_val: 0.05
  split_test: 0.05
  split_seed: 20260911

  # Cache de tensores precomputados. Derivado y descartable: se reconstruye
  # desde los FEN del dataset, que siguen siendo la fuente de verdad.
  cache_dir: /content/ceia-chess/cache

  # Lote grande a proposito: con un tablero de 8x8 un lote chico deja la GPU
  # sin trabajo entre kernels.
  batch_size: 1024
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  # mse | huber -- huber se evalua en 4.5 por la masa acumulada en +-0,9999
  loss: mse

  # Tercer repositorio del proyecto, de tipo Model: pesos, metricas y estado.
  hf_models_repo: ceia-chess-models
  push_to_hub: true
